<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d2a">
<title>Our Little Universe</title>
<style>
:root{--bg:#0b0d2a;--vio:#6d4aff;--pink:#ff9ad5;--cy:#7ee7ff;--tx:#eef0ff;--mut:#a3a8d8;--glass:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 80% at 50% 0,#2a1d6e 0,#0b0d2a 62%) fixed;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
 background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#cfe,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fde,transparent),radial-gradient(1px 1px at 30% 85%,#fff,transparent),radial-gradient(1px 1px at 90% 55%,#fff,transparent);
 animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
#app{position:relative;max-width:480px;margin:0 auto;padding:20px 16px 32px;min-height:100vh}
.c{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:80vh;text-align:center}
h1,h2,.big{font-family:Georgia,serif;font-weight:400;margin:0}
h1{font-size:2rem;font-style:italic}.big{font-size:1.5rem;min-height:3.2em;max-width:20ch}
.mut{color:var(--mut);margin:0}.err{color:#ff8fa3;min-height:1.4em;margin:0}
.star{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 24px 8px var(--pink),0 0 70px 20px var(--vio);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
input,.btn,.ghost,.opt{font:inherit;min-height:48px;border-radius:14px;width:100%;max-width:340px}
input{background:var(--glass);border:1px solid #ffffff30;color:var(--tx);padding:0 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn{border:0;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--vio),#c04cff);box-shadow:0 6px 24px #6d4aff55;padding:0 18px}
.btn:disabled{opacity:.5}
.ghost{background:none;border:0;color:var(--mut);min-height:44px;width:auto;padding:0 12px}
.card{background:var(--glass);border:1px solid #ffffff22;border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:1.2rem;background:linear-gradient(135deg,var(--vio),var(--pink));position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#555;border:2px solid var(--bg)}
.on .dot{background:#5dffa8;box-shadow:0 0 8px #5dffa8}
.thread{flex:1;height:2px;background:linear-gradient(90deg,var(--pink),var(--cy));box-shadow:0 0 10px var(--pink);border-radius:2px}
.score{display:flex;justify-content:space-around;text-align:center;margin:14px 0}
.score b{display:block;font:1.8rem Georgia,serif;color:var(--cy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portal{min-height:112px;text-align:left;border-radius:20px;border:1px solid #ffffff22;padding:12px;color:var(--tx);background:radial-gradient(circle at 80% 20%,#6d4aff66,transparent 60%),var(--glass);font:inherit}
.portal strong{display:block;font-family:Georgia,serif;font-weight:400}.portal span{font-size:.8rem;color:var(--mut)}
.portal[aria-disabled=true]{opacity:.55}.live{border-color:var(--cy);box-shadow:0 0 18px #7ee7ff44}
.q{font:1.35rem/1.35 Georgia,serif;margin:6px 0 14px}
.opt{display:block;max-width:none;margin:8px 0;text-align:left;padding:0 16px;color:var(--tx);background:var(--glass);border:1px solid #ffffff30}
.opt.sel{border-color:var(--pink);background:#ff9ad522}
.rev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rev div{padding:14px;border-radius:16px;background:var(--glass);border:1px solid #ffffff30;animation:flip .7s both}
.rev div+div{animation-delay:.5s}.rev small{color:var(--mut);display:block}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
.match{text-align:center;font:1.3rem Georgia,serif;color:var(--pink)}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- CONFIG: paste your Supabase project URL and publishable (anon) key. Never put a service-role key here.
const CFG = { url: 'https://qhgcntxcnugeyadkcdkg.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoZ2NudHhjbnVnZXlhZGtjZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDUzNDEsImV4cCI6MjEwODUyMTM0MX0.GfbR7NBA93_4GWzixjmwLD3GllRRAVIttZExosEKElE' };
const NAMES = { muhib: 'Muhib', sara: 'Sara' };
const GAMES = [
  ['Chaos Courier', 'Co-op spaceship relay'], ['Mind-Melt', 'Answer together, reveal together', 1],
  ['Orbital Duel', 'Star-grabbing arena'], ['Invisible Blueprint', 'Describe it, rebuild it'],
  ['Panic Button Orchestra', 'Chaotic rhythm'], ['Time-Thief Heist', 'Escape-room puzzles'],
  ['Pixel Heart Heist', 'Memory showdown'], ['The Last Star', 'Final boss']];

const app = document.getElementById('app');
const S = { sb: null, uid: null, room: null, me: null, online: new Set(), round: null, ans: [], score: { rounds: 0, matches: 0 }, view: 'lobby', busy: false, ch: null };

function h(tag, attrs, ...kids) {           // safe DOM builder: text only, never innerHTML
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'on') for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    else if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
const show = (...n) => app.replaceChildren(...n);

function boot() {
  if (CFG.url.startsWith('YOUR_')) return show(h('div', { class: 'c' }, h('h1', {}, 'Setup needed'), h('p', { class: 'mut' }, 'Add your Supabase URL and key at the top of index.html.')));
  S.sb = S.sb || supabase.createClient(CFG.url, CFG.key);
  S.sb.auth.getSession().then(({ data }) => {
    if (data.session) { S.uid = data.session.user.id; enter(); } else auth();
  });
}

function intro() {
  const t = h('p', { class: 'big' });
  const go = h('button', { class: 'btn', hidden: '', on: { click: done } }, 'Enter our universe');
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), t, go, h('button', { class: 'ghost', on: { click: done } }, 'Skip')));
  let over = false;
  [[600, 'Somewhere between Mumbai and Nagpur…'], [3000, '…two people found their own little universe.'], [5800, 'Muhib ♡ Sara']]
    .forEach(([ms, x]) => setTimeout(() => { if (!over) t.textContent = x; }, ms));
  setTimeout(() => { go.hidden = false; }, 6600);
  function done() { over = true; try { localStorage.setItem('olu_intro', '1'); } catch (e) {} boot(); }
}

function auth(msg) {
  const em = h('input', { type: 'email', placeholder: 'Email', autocomplete: 'email', 'aria-label': 'Email' });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Password' });
  const er = h('p', { class: 'err', role: 'alert' }, msg || '');
  const go = h('button', { class: 'btn', on: { click: async () => {
    er.textContent = ''; go.disabled = true;
    const { data, error } = await S.sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    go.disabled = false;
    if (error) er.textContent = error.message; else { S.uid = data.user.id; enter(); }
  } } }, 'Sign in');
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), h('h1', {}, 'Our Little Universe'),
    h('p', { class: 'mut' }, 'Two places. Two hearts. One little universe.'), em, pw, go, er));
}

async function enter() {
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), h('p', { class: 'mut' }, 'Finding your universe…')));
  const { data, error } = await S.sb.rpc('join_room');
  if (error) { await S.sb.auth.signOut(); return auth('This account is not on the guest list for this universe.'); }
  S.room = data.room_id; S.me = data.player;
  connect(); await load(); S.view = 'lobby'; render();
}

function connect() {
  if (S.ch) S.sb.removeChannel(S.ch);
  const refresh = async () => { await load(); render(); };
  S.ch = S.sb.channel('room-' + S.room, { config: { presence: { key: S.me } } })
    .on('presence', { event: 'sync' }, () => { S.online = new Set(Object.keys(S.ch.presenceState())); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mm_answers' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mm_rounds' }, refresh)
    .subscribe(st => { if (st === 'SUBSCRIBED') S.ch.track({ at: Date.now() }); });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.room) load().then(render); });

async function load() {
  const [r, sc] = await Promise.all([
    S.sb.from('mm_rounds').select('*').eq('room_id', S.room).order('idx', { ascending: false }).limit(1),
    S.sb.rpc('mm_score', { r: S.room })]);
  S.round = (r.data && r.data[0]) || null;
  if (sc.data) S.score = sc.data;
  S.ans = [];
  if (S.round) { const a = await S.sb.from('mm_answers').select('user_id,choice').eq('round_id', S.round.id); S.ans = a.data || []; }
}

const render = () => { if (!S.room) return; S.view === 'mm' ? mindMelt() : lobby(); };

function avatar(p) {
  return h('div', { class: 'who' + (S.online.has(p) ? ' on' : '') },
    h('div', { class: 'av', 'aria-hidden': 'true' }, NAMES[p][0], h('i', { class: 'dot' })),
    h('span', {}, NAMES[p], h('small', { class: 'mut' }, ' ' + (S.online.has(p) ? 'online' : 'away'))));
}

function lobby() {
  const other = S.me === 'muhib' ? 'sara' : 'muhib';
  const both = S.online.has('muhib') && S.online.has('sara');
  show(
    h('div', { class: 'top' }, avatar(S.me), h('i', { class: 'thread' }), avatar(other)),
    h('p', { class: 'mut', style: 'text-align:center' }, both ? 'The universe is complete.' : 'Your favourite human hasn’t arrived yet…'),
    h('div', { class: 'card score' },
      h('div', {}, h('b', {}, String(S.score.matches || 0)), 'mind-melts'),
      h('div', {}, h('b', {}, String(S.score.rounds || 0)), 'rounds played')),
    h('div', { class: 'grid' }, GAMES.map(([n, d, live]) => h('button', {
      class: 'portal' + (live ? ' live' : ''), 'aria-disabled': live ? 'false' : 'true',
      on: { click: () => { if (live) { S.view = 'mm'; render(); } } } },
      h('strong', {}, n), h('span', {}, live ? d : 'Not built yet')))),
    h('div', { class: 'top' }, h('button', { class: 'ghost', on: { click: async () => { await S.sb.auth.signOut(); location.reload(); } } }, 'Sign out')));
}

async function newRound() {
  if (S.busy) return; S.busy = true;
  const { error } = await S.sb.rpc('mm_new_round', { r: S.room });
  S.busy = false; if (!error) await load(); render();
}
async function answer(i) {
  if (S.busy) return; S.busy = true;
  await S.sb.rpc('mm_answer', { rid: S.round.id, c: i });
  S.busy = false; await load(); render();
}

function mindMelt() {
  const back = h('button', { class: 'ghost', on: { click: () => { S.view = 'lobby'; render(); } } }, '‹ Back to the universe');
  const r = S.round, mine = S.ans.find(a => a.user_id === S.uid), them = S.ans.find(a => a.user_id !== S.uid), done = S.ans.length >= 2;
  if (!r) return show(back, h('div', { class: 'c' }, h('h2', {}, 'Mind-Melt'),
    h('p', { class: 'mut' }, 'Same question. Secret answers. Revealed together.'), h('button', { class: 'btn', on: { click: newRound } }, 'Start first round')));
  const opts = r.options, kids = [back, h('p', { class: 'mut' }, 'Round ' + r.idx + ' · ' + S.score.matches + ' matched so far'), h('p', { class: 'q' }, r.question)];
  if (done) {
    const mc = mine.choice, tc = them.choice, byP = { [S.me]: mc, [S.me === 'muhib' ? 'sara' : 'muhib']: tc };
    kids.push(h('div', { class: 'rev' }, ['muhib', 'sara'].map(p => h('div', {}, h('small', {}, NAMES[p]), opts[byP[p]]))),
      h('p', { class: 'match' }, mc === tc ? 'Mind-melt! You matched.' : 'Two different universes. Delightful.'),
      h('button', { class: 'btn', style: 'margin:10px auto;display:block', on: { click: newRound } }, 'Next round'));
  } else if (mine) {
    kids.push(h('div', { class: 'opt sel', style: 'display:flex;align-items:center' }, 'Locked: ' + opts[mine.choice]),
      h('p', { class: 'mut' }, 'Waiting for your partner to lock in…'));
  } else opts.forEach((o, i) => kids.push(h('button', { class: 'opt', on: { click: () => answer(i) } }, o)));
  show(...kids);
}

let seen = false; try { seen = localStorage.getItem('olu_intro') === '1'; } catch (e) {}
seen ? boot() : intro();
</script>
</body>
</html>
