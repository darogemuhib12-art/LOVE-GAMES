<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d2a">
<title>Our Little Universe</title>
<style>
:root{--bg:#0b0d2a;--vio:#6d4aff;--pink:#ff9ad5;--cy:#7ee7ff;--tx:#eef0ff;--mut:#a3a8d8;--glass:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 80% at 50% 0,#2a1d6e 0,#0b0d2a 62%) fixed;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
 background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#cfe,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fde,transparent),radial-gradient(1px 1px at 30% 85%,#fff,transparent),radial-gradient(1px 1px at 90% 55%,#fff,transparent);
 animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
#app{position:relative;max-width:480px;margin:0 auto;padding:20px 16px 32px;min-height:100vh}
.c{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:80vh;text-align:center}
h1,h2,.big{font-family:Georgia,serif;font-weight:400;margin:0}
h1{font-size:2rem;font-style:italic}.big{font-size:1.5rem;min-height:3.2em;max-width:20ch}
.mut{color:var(--mut);margin:0}.err{color:#ff8fa3;min-height:1.4em;margin:0}
.star{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 24px 8px var(--pink),0 0 70px 20px var(--vio);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
input,.btn,.ghost,.opt{font:inherit;min-height:48px;border-radius:14px;width:100%;max-width:340px}
input{background:var(--glass);border:1px solid #ffffff30;color:var(--tx);padding:0 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn{border:0;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--vio),#c04cff);box-shadow:0 6px 24px #6d4aff55;padding:0 18px}
.btn:disabled{opacity:.5}
.ghost{background:none;border:0;color:var(--mut);min-height:44px;width:auto;padding:0 12px}
.card{background:var(--glass);border:1px solid #ffffff22;border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:1.2rem;background:linear-gradient(135deg,var(--vio),var(--pink));position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#555;border:2px solid var(--bg)}
.on .dot{background:#5dffa8;box-shadow:0 0 8px #5dffa8}
.thread{flex:1;height:2px;background:linear-gradient(90deg,var(--pink),var(--cy));box-shadow:0 0 10px var(--pink);border-radius:2px}
.score{display:flex;justify-content:space-around;text-align:center;margin:14px 0}
.score b{display:block;font:1.8rem Georgia,serif;color:var(--cy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portal{min-height:112px;text-align:left;border-radius:20px;border:1px solid #ffffff22;padding:12px;color:var(--tx);background:radial-gradient(circle at 80% 20%,#6d4aff66,transparent 60%),var(--glass);font:inherit}
.portal strong{display:block;font-family:Georgia,serif;font-weight:400}.portal span{font-size:.8rem;color:var(--mut)}
.portal[aria-disabled=true]{opacity:.55}.live{border-color:var(--cy);box-shadow:0 0 18px #7ee7ff44}
.q{font:1.35rem/1.35 Georgia,serif;margin:6px 0 14px}
.opt{display:block;max-width:none;margin:8px 0;text-align:left;padding:0 16px;color:var(--tx);background:var(--glass);border:1px solid #ffffff30}
.opt.sel{border-color:var(--pink);background:#ff9ad522}
.rev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rev div{padding:14px;border-radius:16px;background:var(--glass);border:1px solid #ffffff30;animation:flip .7s both}
.rev div+div{animation-delay:.5s}.rev small{color:var(--mut);display:block}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
.match{text-align:center;font:1.3rem Georgia,serif;color:var(--pink)}
.ccv{width:100%;max-width:300px;aspect-ratio:300/420;border-radius:18px;background:#070a22;border:1px solid #ffffff30;touch-action:none}
.cc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.cc2 .btn,#shb{max-width:none;min-height:64px;touch-action:none;user-select:none}
.bpg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:260px;margin:10px auto}
.bpc{aspect-ratio:1;min-height:0;border-radius:10px;border:1px solid #ffffff30;background:var(--glass);padding:0}
button.bpc{min-height:44px}.bpc.on{background:linear-gradient(135deg,var(--pink),var(--vio));box-shadow:0 0 12px #ff9ad566}
.bpg.sm{gap:3px}.bpg.sm .bpc{border-radius:5px}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tok{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid #ffffff30;background:var(--glass);color:var(--tx);font:inherit}
.clog{margin:8px 0;padding:0;list-style:none}.clog li{padding:8px 12px;margin:4px 0;border-radius:12px;background:var(--glass)}
.orbit{position:relative;width:200px;height:200px;display:grid;place-items:center}
.os{position:absolute;left:calc(50% - 5px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--pink),0 0 30px var(--vio);animation:orb 12s linear infinite;animation-delay:calc(var(--i)*-1.5s)}
@keyframes orb{from{transform:rotate(0) translateX(90px)}to{transform:rotate(360deg) translateX(90px)}}
.bd{font-size:1.8rem;font-style:italic;animation:fade 3s both}
.para{font-family:Georgia,serif;margin:0 0 .9em;animation:fade 2s both}
.letter{background:#fff8f0;color:#2b2140;border-radius:18px;padding:22px;text-align:left;font-family:Georgia,serif;box-shadow:0 0 40px #ff9ad566;animation:fade 2s both}
.letter p{margin:0 0 .8em}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- CONFIG: paste your Supabase project URL and publishable (anon) key. Never put a service-role key here.
const CFG = { url: 'https://qhgcntxcnugeyadkcdkg.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoZ2NudHhjbnVnZXlhZGtjZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDUzNDEsImV4cCI6MjEwODUyMTM0MX0.GfbR7NBA93_4GWzixjmwLD3GllRRAVIttZExosEKElE' };
const FINALE_AT = 5; // mind-melt matches needed (also enforced in the database)
const NAMES = { muhib: 'Muhib', sara: 'Sara' };
const GAMES = [
  ['Chaos Courier', 'Muhib steers, Sara shields', 'cc'], ['Mind-Melt', 'Answer together, reveal together', 1],
  ['Orbital Duel', 'Race for the stars', 'od'], ['Invisible Blueprint', 'Describe it, rebuild it', 'bp'],
  ['Panic Button Orchestra', 'Chaotic rhythm'], ['Time-Thief Heist', 'Escape-room puzzles'],
  ['Pixel Heart Heist', 'Memory showdown'], ['The Last Star', 'Final boss']];

const app = document.getElementById('app');
const S = { sb: null, uid: null, room: null, me: null, online: new Set(), round: null, ans: [], score: { rounds: 0, matches: 0 }, view: 'lobby', busy: false, ch: null };

function h(tag, attrs, ...kids) {           // safe DOM builder: text only, never innerHTML
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'on') for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    else if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
const show = (...n) => app.replaceChildren(...n);

function boot() {
  if (CFG.url.startsWith('YOUR_')) return show(h('div', { class: 'c' }, h('h1', {}, 'Setup needed'), h('p', { class: 'mut' }, 'Add your Supabase URL and key at the top of index.html.')));
  S.sb = S.sb || supabase.createClient(CFG.url, CFG.key);
  S.sb.auth.getSession().then(({ data }) => {
    if (data.session) { S.uid = data.session.user.id; enter(); } else auth();
  });
}

function intro() {
  const t = h('p', { class: 'big' });
  const go = h('button', { class: 'btn', hidden: '', on: { click: done } }, 'Enter our universe');
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), t, go, h('button', { class: 'ghost', on: { click: done } }, 'Skip')));
  let over = false;
  [[600, 'Somewhere between Mumbai and Nagpur…'], [3000, '…two people found their own little universe.'], [5800, 'Muhib ♡ Sara']]
    .forEach(([ms, x]) => setTimeout(() => { if (!over) t.textContent = x; }, ms));
  setTimeout(() => { go.hidden = false; }, 6600);
  function done() { over = true; try { localStorage.setItem('olu_intro', '1'); } catch (e) {} boot(); }
}

function auth(msg) {
  const em = h('input', { type: 'email', placeholder: 'Email', autocomplete: 'email', 'aria-label': 'Email' });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', 'aria-label': 'Password' });
  const er = h('p', { class: 'err', role: 'alert' }, msg || '');
  const go = h('button', { class: 'btn', on: { click: async () => {
    er.textContent = ''; go.disabled = true;
    const { data, error } = await S.sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    go.disabled = false;
    if (error) er.textContent = error.message; else { S.uid = data.user.id; enter(); }
  } } }, 'Sign in');
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), h('h1', {}, 'Our Little Universe'),
    h('p', { class: 'mut' }, 'Two places. Two hearts. One little universe.'), em, pw, go, er));
}

async function enter() {
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), h('p', { class: 'mut' }, 'Finding your universe…')));
  const { data, error } = await S.sb.rpc('join_room');
  if (error) { await S.sb.auth.signOut(); return auth('This account is not on the guest list for this universe.'); }
  S.room = data.room_id; S.me = data.player;
  connect(); await load(); S.view = 'lobby'; render();
  clearInterval(S.hb); S.hb = setInterval(() => S.sb.rpc('touch_room'), 30000);
}

function connect() {
  if (S.ch) S.sb.removeChannel(S.ch);
  const refresh = async () => { await load(); render(); };
  S.ch = S.sb.channel('room-' + S.room, { config: { presence: { key: S.me } } })
    .on('presence', { event: 'sync' }, () => { S.online = new Set(Object.keys(S.ch.presenceState())); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mm_answers' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mm_rounds' }, refresh)
    .on('broadcast', { event: 'cc' }, ({ payload }) => ccMsg(payload))
    .on('broadcast', { event: 'od' }, ({ payload }) => odMsg(payload))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bp_rounds' }, () => bpRefresh())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bp_clues' }, () => bpRefresh())
    .subscribe(st => { if (st === 'SUBSCRIBED') S.ch.track({ at: Date.now() }); });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.room) load().then(render); });

async function load() {
  const [r, sc] = await Promise.all([
    S.sb.from('mm_rounds').select('*').eq('room_id', S.room).order('idx', { ascending: false }).limit(1),
    S.sb.rpc('mm_score', { r: S.room })]);
  S.round = (r.data && r.data[0]) || null;
  if (sc.data) S.score = sc.data;
  S.ans = [];
  if (S.round) { const a = await S.sb.from('mm_answers').select('user_id,choice').eq('round_id', S.round.id); S.ans = a.data || []; }
}

const render = () => { if (!S.room || S.view === 'fin' || S.view === 'cc' || S.view === 'od' || S.view === 'bp') return; S.view === 'mm' ? mindMelt() : lobby(); };

function avatar(p) {
  return h('div', { class: 'who' + (S.online.has(p) ? ' on' : '') },
    h('div', { class: 'av', 'aria-hidden': 'true' }, NAMES[p][0], h('i', { class: 'dot' })),
    h('span', {}, NAMES[p], h('small', { class: 'mut' }, ' ' + (S.online.has(p) ? 'online' : 'away'))));
}

function lobby() {
  const other = S.me === 'muhib' ? 'sara' : 'muhib';
  const both = S.online.has('muhib') && S.online.has('sara');
  const mm = S.score.matches || 0, unlocked = mm >= FINALE_AT;
  show(
    h('div', { class: 'top' }, avatar(S.me), h('i', { class: 'thread' }), avatar(other)),
    h('p', { class: 'mut', style: 'text-align:center' }, both ? 'The universe is complete.' : 'Your favourite human hasn’t arrived yet…'),
    h('div', { class: 'card score' },
      h('div', {}, h('b', {}, String(S.score.matches || 0)), 'mind-melts'),
      h('div', {}, h('b', {}, String(S.score.rounds || 0)), 'rounds played')),
    h('div', { class: 'card', style: 'margin-bottom:12px;text-align:center' },
      h('p', { class: 'mut', style: 'margin-bottom:8px' }, unlocked ? 'The birthday finale is unlocked.' : 'Birthday finale unlocks at ' + FINALE_AT + ' mind-melts (' + mm + '/' + FINALE_AT + ')'),
      unlocked ? h('button', { class: 'btn', on: { click: () => { S.view = 'fin'; finale(); } } }, 'Open the finale') : null),
    h('div', { class: 'grid' }, GAMES.map(([n, d, live]) => h('button', {
      class: 'portal' + (live ? ' live' : ''), 'aria-disabled': live ? 'false' : 'true',
      on: { click: () => { if (live === 'cc') ccScreen(); else if (live === 'od') odScreen(); else if (live === 'bp') bpScreen(); else if (live) { S.view = 'mm'; render(); } } } },
      h('strong', {}, n), h('span', {}, live ? d : 'Not built yet')))),
    h('div', { class: 'top' }, h('button', { class: 'ghost', on: { click: async () => { clearInterval(S.hb); await S.sb.rpc('leave_room'); await S.sb.auth.signOut(); location.reload(); } } }, 'Sign out')));
}

async function newRound() {
  if (S.busy) return; S.busy = true;
  const { error } = await S.sb.rpc('mm_new_round', { r: S.room });
  S.busy = false; if (!error) await load(); render();
}
async function answer(i) {
  if (S.busy) return; S.busy = true;
  await S.sb.rpc('mm_answer', { rid: S.round.id, c: i });
  S.busy = false; await load(); render();
}

function mindMelt() {
  const back = h('button', { class: 'ghost', on: { click: () => { S.view = 'lobby'; render(); } } }, '‹ Back to the universe');
  const r = S.round, mine = S.ans.find(a => a.user_id === S.uid), them = S.ans.find(a => a.user_id !== S.uid), done = S.ans.length >= 2;
  if (!r) return show(back, h('div', { class: 'c' }, h('h2', {}, 'Mind-Melt'),
    h('p', { class: 'mut' }, 'Same question. Secret answers. Revealed together.'), h('button', { class: 'btn', on: { click: newRound } }, 'Start first round')));
  const opts = r.options, kids = [back, h('p', { class: 'mut' }, 'Round ' + r.idx + ' · ' + S.score.matches + ' matched so far'), h('p', { class: 'q' }, r.question)];
  if (done) {
    const mc = mine.choice, tc = them.choice, byP = { [S.me]: mc, [S.me === 'muhib' ? 'sara' : 'muhib']: tc };
    kids.push(h('div', { class: 'rev' }, ['muhib', 'sara'].map(p => h('div', {}, h('small', {}, NAMES[p]), opts[byP[p]]))),
      h('p', { class: 'match' }, mc === tc ? 'Mind-melt! You matched.' : 'Two different universes. Delightful.'),
      h('button', { class: 'btn', style: 'margin:10px auto;display:block', on: { click: newRound } }, 'Next round'));
  } else if (mine) {
    kids.push(h('div', { class: 'opt sel', style: 'display:flex;align-items:center' }, 'Locked: ' + opts[mine.choice]),
      h('p', { class: 'mut' }, 'Waiting for your partner to lock in…'));
  } else opts.forEach((o, i) => kids.push(h('button', { class: 'opt', on: { click: () => answer(i) } }, o)));
  show(...kids);
}

// ---------- CHAOS COURIER ----------
// Muhib's phone runs the simulation (host), Sara's phone sends shield input and renders snapshots.
const CC = { H: .85, GOAL: 1000 };
let cc = null;
function ccStop() {
  if (!cc) return;
  cancelAnimationFrame(cc.raf); removeEventListener('keydown', cc.kd); removeEventListener('keyup', cc.ku); cc = null;
}
function ccScreen(msg) {
  ccStop(); S.view = 'cc';
  const host = S.me === 'muhib';
  const back = h('button', { class: 'ghost', on: { click: () => { ccStop(); S.view = 'lobby'; lobby(); } } }, '‹ Back to the universe');
  const cv = h('canvas', { width: 300, height: 420, class: 'ccv', 'aria-label': 'Chaos Courier game' });
  const note = h('p', { class: 'mut', style: 'text-align:center;min-height:3em' }, msg || (host
    ? 'You steer and can see asteroids. Sara sees the storms and runs the shield. Pink bar: energy. Talk to each other!'
    : 'You see storms and hold the shield (it drains). Muhib steers and sees the asteroids. Tell him where to go!'));
  const start = host ? h('button', { class: 'btn', on: { click: ccStart } }, 'Launch') : null;
  const ctl = host
    ? h('div', { class: 'cc2' }, h('button', { class: 'btn', on: { pointerdown: e => { e.preventDefault(); ccLane(-1); } } }, '‹ Left'),
        h('button', { class: 'btn', on: { pointerdown: e => { e.preventDefault(); ccLane(1); } } }, 'Right ›'))
    : h('button', { class: 'btn', id: 'shb', on: { pointerdown: e => { e.preventDefault(); ccShield(true); }, pointerup: () => ccShield(false), pointercancel: () => ccShield(false), pointerleave: () => ccShield(false) } }, 'Hold for shield');
  show(back, h('div', { style: 'display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px' }, cv, note, ctl, start));
  cc = { cv, note, start, host, raf: 0, sim: null, st: null, run: false, shIn: false, my: false };
  cc.kd = e => { if (host && e.key === 'ArrowLeft') ccLane(-1); else if (host && e.key === 'ArrowRight') ccLane(1); else if (!host && e.code === 'Space') { e.preventDefault(); ccShield(true); } };
  cc.ku = e => { if (!host && e.code === 'Space') ccShield(false); };
  addEventListener('keydown', cc.kd); addEventListener('keyup', cc.ku);
  ccDraw();
  S.sb.from('cc_runs').select('score,won').eq('room_id', S.room).order('score', { ascending: false }).limit(1)
    .then(({ data }) => { if (cc && !msg && data && data[0]) note.textContent += ' Best score: ' + data[0].score + '.'; });
}
function ccLane(d) { if (cc && cc.run && cc.host) cc.sim.lane = Math.max(0, Math.min(2, cc.sim.lane + d)); }
function ccShield(on) {
  if (!cc || cc.host || cc.my === on) return;
  cc.my = on; S.ch.send({ type: 'broadcast', event: 'cc', payload: { k: 'sh', on } });
}
function ccStart() {
  if (!S.online.has('sara')) { cc.note.textContent = 'Sara is not online yet. Ask her to open the app.'; return; }
  cc.sim = { lane: 1, e: 100, d: 0, sh: false, m: 100, o: [], sp: 1, last: performance.now(), snap: 0, id: crypto.randomUUID() };
  cc.run = true; cc.shIn = false; cc.start.hidden = true; cc.note.textContent = 'Go!';
  S.ch.send({ type: 'broadcast', event: 'cc', payload: { k: 'start' } });
  cc.raf = requestAnimationFrame(ccTick);
}
function ccTick(t) {
  const c = cc; if (!c || !c.run) return;
  const s = c.sim, dt = Math.min(.05, (t - s.last) / 1000); s.last = t;
  const v = .45 + s.d / 2200;
  s.d += v * dt * 40;
  if ((s.sp -= dt) <= 0) { s.sp = Math.max(.45, 1.1 - s.d / 1800); s.o.push({ t: Math.random() < .5 ? 'a' : 's', l: Math.floor(Math.random() * 3), y: -.05, hit: 0 }); }
  s.sh = c.shIn && s.m > 0;
  s.m = s.sh ? Math.max(0, s.m - 28 * dt) : Math.min(100, s.m + 12 * dt);
  for (const o of s.o) {
    o.y += v * dt;
    if (!o.hit && o.l === s.lane && Math.abs(o.y - CC.H) < .045) { o.hit = 1; if (o.t === 'a') s.e -= 20; else if (!s.sh) s.e -= 25; }
  }
  s.o = s.o.filter(o => o.y < 1.1);
  if ((s.snap -= dt) <= 0) {
    s.snap = .1;
    S.ch.send({ type: 'broadcast', event: 'cc', payload: { k: 's', l: s.lane, e: s.e, d: s.d, h: s.sh ? 1 : 0, m: s.m, o: s.o.map(o => [o.t, o.l, +o.y.toFixed(3)]) } });
  }
  ccDraw();
  if (s.e <= 0 || s.d >= CC.GOAL) return ccEnd(s.e > 0);
  c.raf = requestAnimationFrame(ccTick);
}
async function ccEnd(won) {
  const s = cc.sim, score = won ? Math.round(s.e * 10 + 500) : Math.round(s.d);
  S.ch.send({ type: 'broadcast', event: 'cc', payload: { k: 'end', won, score } });
  ccResult(won, score);
  const { error } = await S.sb.rpc('cc_finish', { rid: s.id, r: S.room, sc: score, w: won });
  if (error && cc) cc.note.textContent += ' (Could not save the score.)';
}
function ccResult(won, score) {
  if (!cc) return; cc.run = false;
  cc.note.textContent = (won ? 'Message delivered! ' : 'The courier crashed. ') + 'Score: ' + score + '.';
  if (cc.start) { cc.start.hidden = false; cc.start.textContent = 'Launch again'; }
}
function ccMsg(p) {
  if (!p) return;
  if (S.me === 'muhib') { if (p.k === 'sh' && cc && cc.run) cc.shIn = !!p.on; return; }
  if (p.k === 'start') { if (!cc || S.view !== 'cc') ccScreen(); cc.run = true; cc.st = null; cc.note.textContent = 'Go! Hold the shield when a storm reaches Muhib\u2019s lane.'; }
  else if (p.k === 's' && cc) { cc.run = true; cc.st = p; ccDraw(); }
  else if (p.k === 'end') ccResult(p.won, p.score);
}
function ccDraw() {
  const c = cc; if (!c) return;
  const g = c.cv.getContext('2d'), W = 300, Hh = 420, s = c.host ? c.sim : c.st;
  g.fillStyle = '#070a22'; g.fillRect(0, 0, W, Hh);
  g.strokeStyle = '#ffffff22';
  for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(i * 100, 0); g.lineTo(i * 100, Hh); g.stroke(); }
  if (!s) return;
  const lane = c.host ? s.lane : s.l, sh = c.host ? s.sh : s.h;
  const obs = c.host ? s.o.map(o => [o.t, o.l, o.y]) : s.o;
  for (const [t, l, y] of obs) {
    const py = y * Hh;
    if (c.host && t === 'a') { g.fillStyle = '#a3a8d8'; g.beginPath(); g.arc(l * 100 + 50, py, 20, 0, 7); g.fill(); }
    if (!c.host && t === 's') { g.fillStyle = 'rgba(126,231,255,.4)'; g.fillRect(l * 100 + 8, py - 14, 84, 28); }
  }
  const x = lane * 100 + 50, y = CC.H * Hh;
  g.fillStyle = '#ff9ad5'; g.beginPath(); g.moveTo(x, y - 18); g.lineTo(x + 14, y + 14); g.lineTo(x - 14, y + 14); g.fill();
  if (sh) { g.strokeStyle = '#7ee7ff'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 30, 0, 7); g.stroke(); g.lineWidth = 1; }
  g.fillStyle = '#ffffff22'; g.fillRect(10, 8, 280, 8); g.fillStyle = '#ff9ad5'; g.fillRect(10, 8, 280 * Math.max(0, s.e) / 100, 8);
  g.fillStyle = '#7ee7ff'; g.fillRect(10, 20, 280 * Math.min(1, s.d / CC.GOAL), 4);
  if (!c.host) { g.fillStyle = '#ffffff22'; g.fillRect(10, Hh - 14, 280, 6); g.fillStyle = '#7ee7ff'; g.fillRect(10, Hh - 14, 280 * s.m / 100, 6); }
}

// ---------- THE INVISIBLE BLUEPRINT ----------
// The pattern is stored server-side; only the describer's account can read it (row-level security).
const BP_WORDS = ['row', 'col', '1', '2', '3', '4', 'filled', 'empty', 'all', 'none', 'and', 'next', 'left', 'right', 'top', 'bottom'];
let bp = null;
async function bpLoad() {
  const r = await S.sb.from('bp_rounds').select('*').eq('room_id', S.room).order('idx', { ascending: false }).limit(1);
  const rd = (r.data && r.data[0]) || null;
  let cl = [], sol = null;
  if (rd) {
    const [c, s] = await Promise.all([S.sb.from('bp_clues').select('n,txt').eq('round_id', rd.id).order('n'),
      S.sb.from('bp_secrets').select('solution').eq('round_id', rd.id)]);
    cl = c.data || []; sol = (s.data && s.data[0]) ? s.data[0].solution : null;
  }
  const t = await S.sb.rpc('bp_total', { r: S.room });
  const same = bp && bp.rd && rd && bp.rd.id === rd.id;
  bp = { rd, cl, sol, tot: t.data || { rounds: 0, total: 0 }, grid: same ? bp.grid : Array(16).fill(0), draft: same ? bp.draft : [], err: '', busy: false };
}
async function bpRefresh() { if (S.view === 'bp') { await bpLoad(); bpRender(); } }
async function bpScreen() { S.view = 'bp'; bp = null; show(h('div', { class: 'c' }, h('div', { class: 'star' }))); await bpLoad(); bpRender(); }
async function bpCall(fn, args) {
  if (!bp || bp.busy) return; bp.busy = true;
  const { error } = await S.sb.rpc(fn, args);
  await bpLoad(); if (error) bp.err = error.message; bpRender();
}
function gridEl(str, tap, small) {
  return h('div', { class: 'bpg' + (small ? ' sm' : '') }, [...Array(16)].map((_, i) => {
    const on = str && str[i] === '1', cls = 'bpc' + (on ? ' on' : '');
    return tap ? h('button', { class: cls, 'aria-pressed': String(on), 'aria-label': 'Row ' + (Math.floor(i / 4) + 1) + ' column ' + (i % 4 + 1), on: { click: () => tap(i) } })
      : h('div', { class: cls });
  }));
}
function bpRender() {
  if (S.view !== 'bp' || !bp) return;
  const rd = bp.rd, done = rd && rd.status === 'done', desc = rd && rd.describer_id === S.uid;
  const back = h('button', { class: 'ghost', on: { click: () => { S.view = 'lobby'; lobby(); } } }, '‹ Back to the universe');
  const kids = [back, h('p', { class: 'mut' }, 'Rounds done: ' + bp.tot.rounds + ' · Points: ' + bp.tot.total)];
  const clues = h('ul', { class: 'clog' }, bp.cl.length ? bp.cl.map(c => h('li', {}, c.n + '. ' + c.txt)) : h('li', { class: 'mut' }, 'No clues yet.'));
  if (!rd || done) {
    if (done) kids.push(h('p', { class: 'q' }, 'Round ' + rd.idx + ': ' + rd.score + ' points'), h('p', { class: 'mut' }, 'The blueprint, then what was built'),
      h('div', { class: 'rev' }, h('div', {}, gridEl(bp.sol, null, 1)), h('div', {}, gridEl(rd.submitted, null, 1))));
    else kids.push(h('div', { class: 'c', style: 'min-height:40vh' }, h('h2', {}, 'The Invisible Blueprint'),
      h('p', { class: 'mut' }, 'One of you sees a secret pattern. The other must rebuild it using only a few coded clues. Roles swap every round.')));
    kids.push(h('button', { class: 'btn', style: 'display:block;margin:12px auto', on: { click: () => bpCall('bp_new_round', { r: S.room }) } }, done ? 'Next round' : 'Start first round'));
  } else if (desc) {
    const left = 8 - bp.cl.length;
    kids.push(h('p', { class: 'q' }, 'You see the blueprint'), bp.sol ? gridEl(bp.sol, null) : h('p', { class: 'err' }, 'Could not load the blueprint.'),
      h('p', { class: 'mut' }, 'Rows count from the top, columns from the left. Build a clue from the words below (' + left + ' clues left).'),
      h('p', { style: 'min-height:1.6em' }, bp.draft.join(' ') || '…'),
      h('div', { class: 'toks' }, BP_WORDS.map(w => h('button', { class: 'tok', on: { click: () => { if (bp.draft.length < 6) { bp.draft.push(w); bpRender(); } } } }, w))),
      h('div', { class: 'cc2' }, h('button', { class: 'btn', on: { click: () => { bp.draft = []; bpRender(); } } }, 'Clear'),
        h('button', { class: 'btn', on: { click: () => { const w = bp.draft; bp.draft = []; bpCall('bp_clue', { rid: rd.id, words: w }); } } }, 'Send clue')), clues);
    if (!bp.draft.length || left <= 0) kids[kids.length - 2].lastChild.disabled = true;
  } else {
    kids.push(h('p', { class: 'q' }, 'Rebuild the blueprint'), h('p', { class: 'mut' }, 'Your partner sees the pattern. Read their clues, tap the cells to fill them, then submit.'),
      gridEl(bp.grid.join(''), i => { bp.grid[i] ^= 1; bpRender(); }), clues,
      h('button', { class: 'btn', style: 'display:block;margin:12px auto', on: { click: () => bpCall('bp_submit', { rid: rd.id, grid: bp.grid.join('') }) } }, 'Submit build'));
  }
  kids.push(h('p', { class: 'err', role: 'alert' }, bp.err));
  show(...kids);
}

// ---------- ORBITAL DUEL ----------
// Muhib's phone simulates both ships; Sara sends her touch target and dash presses.
let od = null;
function odStop() { if (od) { cancelAnimationFrame(od.raf); od = null; } }
function odScreen(msg) {
  odStop(); S.view = 'od';
  const host = S.me === 'muhib';
  const back = h('button', { class: 'ghost', on: { click: () => { odStop(); S.view = 'lobby'; lobby(); } } }, '‹ Back to the universe');
  const cv = h('canvas', { width: 300, height: 420, class: 'ccv', 'aria-label': 'Orbital Duel arena' });
  const note = h('p', { class: 'mut', style: 'text-align:center;min-height:3em' }, msg || 'Touch and drag in the arena to fly. Grab more stars than your partner. Red orbs stun you. Dash has a 3 second cooldown.');
  const dash = h('button', { class: 'btn', style: 'max-width:none;min-height:60px;touch-action:none', on: { pointerdown: e => { e.preventDefault(); odDash(); } } }, 'Dash');
  const start = host ? h('button', { class: 'btn', on: { click: odStart } }, 'Launch') : null;
  show(back, h('div', { style: 'display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px' }, cv, note, dash, start));
  od = { cv, note, start, host, raf: 0, sim: null, st: null, run: false, tx: 150, ty: 300, sent: 0 };
  const mv = e => { const r = cv.getBoundingClientRect(); od.tx = (e.clientX - r.left) / r.width * 300; od.ty = (e.clientY - r.top) / r.height * 420; odInput(); };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); mv(e); });
  cv.addEventListener('pointermove', e => { if (e.buttons) mv(e); });
  odDraw();
}
function odInput() {
  if (!od || !od.run) return;
  if (od.host) { od.sim.m.tx = od.tx; od.sim.m.ty = od.ty; return; }
  const n = performance.now(); if (n - od.sent < 50) return; od.sent = n;
  S.ch.send({ type: 'broadcast', event: 'od', payload: { k: 'in', x: od.tx, y: od.ty } });
}
function odDash() {
  if (!od || !od.run) return;
  if (od.host) od.sim.m.dreq = true; else S.ch.send({ type: 'broadcast', event: 'od', payload: { k: 'dash' } });
}
function odStart() {
  if (!S.online.has('sara')) { od.note.textContent = 'Sara is not online yet. Ask her to open the app.'; return; }
  const sh = (x, y) => ({ x, y, tx: x, ty: y, sc: 0, cd: 0, dash: 0, stun: 0, dreq: false });
  od.sim = { m: sh(75, 380), s: sh(225, 380), stars: [], orbs: [{ x: 60, y: 100, vx: 70, vy: 55 }, { x: 240, y: 200, vx: -60, vy: 80 }, { x: 150, y: 300, vx: 90, vy: -50 }],
    t: 45, last: performance.now(), snap: 0, id: crypto.randomUUID() };
  od.run = true; od.start.hidden = true; od.note.textContent = 'Go!';
  S.ch.send({ type: 'broadcast', event: 'od', payload: { k: 'start' } });
  od.raf = requestAnimationFrame(odTick);
}
function odTick(t) {
  const c = od; if (!c || !c.run) return;
  const s = c.sim, dt = Math.min(.05, (t - s.last) / 1000); s.last = t; s.t -= dt;
  for (const o of [s.m, s.s]) {
    o.cd = Math.max(0, o.cd - dt); o.dash = Math.max(0, o.dash - dt); o.stun = Math.max(0, o.stun - dt);
    if (o.dreq && o.cd === 0 && o.stun === 0) { o.dash = .15; o.cd = 3; }
    o.dreq = false;
    if (o.stun === 0) {
      const dx = o.tx - o.x, dy = o.ty - o.y, d = Math.hypot(dx, dy) || 1, sp = (o.dash > 0 ? 420 : 130) * dt;
      if (d > 4) { const k = Math.min(sp, d) / d; o.x += dx * k; o.y += dy * k; }
    }
    for (const st of s.stars) if (Math.hypot(st.x - o.x, st.y - o.y) < 18) { st.x = -99; o.sc++; }
    if (o.stun === 0) for (const b of s.orbs) if (Math.hypot(b.x - o.x, b.y - o.y) < 20) { o.stun = 1; o.sc = Math.max(0, o.sc - 1); break; }
  }
  s.stars = s.stars.filter(q => q.x > 0);
  while (s.stars.length < 3) s.stars.push({ x: 20 + Math.random() * 260, y: 40 + Math.random() * 340 });
  for (const b of s.orbs) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < 10 || b.x > 290) b.vx *= -1; if (b.y < 30 || b.y > 410) b.vy *= -1; }
  if ((s.snap -= dt) <= 0) {
    s.snap = .08;
    const sp = o => [Math.round(o.x), Math.round(o.y), o.sc, +o.cd.toFixed(1), o.stun > 0 ? 1 : 0];
    S.ch.send({ type: 'broadcast', event: 'od', payload: { k: 's', t: s.t, m: sp(s.m), s: sp(s.s), st: s.stars.map(q => [Math.round(q.x), Math.round(q.y)]), o: s.orbs.map(b => [Math.round(b.x), Math.round(b.y)]) } });
  }
  odDraw();
  if (s.t <= 0) return odEnd();
  c.raf = requestAnimationFrame(odTick);
}
async function odEnd() {
  const s = od.sim, ms = s.m.sc, ss = s.s.sc;
  S.ch.send({ type: 'broadcast', event: 'od', payload: { k: 'end', ms, ss } });
  odResult(ms, ss);
  const { error } = await S.sb.rpc('od_finish', { rid: s.id, r: S.room, ms, ss });
  if (error && od) od.note.textContent += ' (Could not save the result.)';
}
function odResult(ms, ss) {
  if (!od) return; od.run = false;
  od.note.textContent = (ms === ss ? 'A tie. Suspiciously romantic.' : (ms > ss ? 'Muhib wins' : 'Sara wins') + '. The loser gets to demand a rematch.') + ' Final: Muhib ' + ms + ' – ' + ss + ' Sara.';
  if (od.start) { od.start.hidden = false; od.start.textContent = 'Rematch'; }
}
function odMsg(p) {
  if (!p) return;
  if (S.me === 'muhib') {
    if (!od || !od.run) return;
    if (p.k === 'in') { od.sim.s.tx = Math.max(0, Math.min(300, +p.x || 0)); od.sim.s.ty = Math.max(0, Math.min(420, +p.y || 0)); }
    else if (p.k === 'dash') od.sim.s.dreq = true;
    return;
  }
  if (p.k === 'start') { if (!od || S.view !== 'od') odScreen(); od.run = true; od.st = null; od.note.textContent = 'Go!'; }
  else if (p.k === 's' && od) { od.run = true; od.st = p; odDraw(); }
  else if (p.k === 'end') odResult(p.ms, p.ss);
}
function odDraw() {
  const c = od; if (!c) return;
  const g = c.cv.getContext('2d'); g.fillStyle = '#070a22'; g.fillRect(0, 0, 300, 420);
  let v = null;
  if (c.host && c.sim) { const s = c.sim, sp = o => [o.x, o.y, o.sc, o.cd, o.stun > 0 ? 1 : 0]; v = { t: s.t, m: sp(s.m), s: sp(s.s), st: s.stars.map(q => [q.x, q.y]), o: s.orbs.map(b => [b.x, b.y]) }; }
  else if (c.st) v = c.st;
  if (!v) return;
  g.fillStyle = '#ffe58a'; for (const [x, y] of v.st) { g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); }
  g.fillStyle = '#ff5c7a'; for (const [x, y] of v.o) { g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill(); }
  [[v.m, '#7ee7ff'], [v.s, '#ff9ad5']].forEach(([p, col]) => {
    g.globalAlpha = p[4] ? .35 : 1; g.fillStyle = col; g.beginPath(); g.arc(p[0], p[1], 11, 0, 7); g.fill(); g.globalAlpha = 1;
  });
  g.fillStyle = '#eef0ff'; g.font = '14px system-ui'; g.fillText('Muhib ' + v.m[2], 10, 18); g.textAlign = 'right'; g.fillText('Sara ' + v.s[2], 290, 18);
  g.textAlign = 'center'; g.fillText(Math.max(0, Math.ceil(v.t)) + 's', 150, 18); g.textAlign = 'left';
  const me = c.host ? v.m : v.s; g.fillStyle = '#ffffff22'; g.fillRect(10, 408, 280, 5); g.fillStyle = '#7ee7ff'; g.fillRect(10, 408, 280 * (1 - me[3] / 3), 5);
}

async function finale() {
  show(h('div', { class: 'c' }, h('div', { class: 'star' }), h('p', { class: 'mut' }, 'Opening…')));
  const { data, error } = await S.sb.rpc('get_finale', { r: S.room });
  const back = () => { S.view = 'lobby'; lobby(); };
  if (error || !data) { S.view = 'lobby'; return lobby(); }   // server refuses until the unlock condition is met
  const orbit = h('div', { class: 'orbit' }, h('div', { class: 'av', style: 'width:64px;height:64px;font-size:1.8rem' }, 'S'),
    [...Array(8)].map((_, i) => h('i', { class: 'os', style: '--i:' + i })));
  const msg = h('div', {});
  const btn = h('button', { class: 'btn', hidden: '', on: { click: () => letter(data, back) } }, 'Open your last little surprise');
  show(h('div', { class: 'c' }, orbit, h('h1', { class: 'bd' }, 'Happy Birthday, Sara'), msg, btn,
    h('button', { class: 'ghost', on: { click: back } }, 'Back to the universe')));
  const paras = String(data.message).split(/\n\s*\n/);
  paras.forEach((p, i) => setTimeout(() => { if (S.view === 'fin') msg.append(h('p', { class: 'para' }, p)); }, 2500 + i * 3500));
  setTimeout(() => { if (S.view === 'fin') btn.hidden = false; }, 2500 + paras.length * 3500);
}

function letter(data, back) {
  show(h('div', { style: 'padding-top:20px' },
    h('div', { class: 'letter' }, String(data.letter).split(/\n\s*\n/).map(p => h('p', {}, p))),
    h('div', { class: 'card', style: 'margin:16px 0;text-align:center' },
      h('p', { class: 'mut' }, 'Your journey so far'),
      h('p', {}, S.score.rounds + ' rounds played · ' + S.score.matches + ' mind-melts')),
    h('div', { class: 'c', style: 'min-height:0' }, h('div', { class: 'star' }), h('p', { class: 'mut' }, 'This little universe is yours.'),
      h('button', { class: 'btn', on: { click: back } }, 'Back to the universe'))));
}

let seen = false; try { seen = localStorage.getItem('olu_intro') === '1'; } catch (e) {}
seen ? boot() : intro();
